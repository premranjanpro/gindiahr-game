<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GIndia Game | Play</title><meta name="description" content="Play a GIndia Game directly from a shareable game URL."><link rel="icon" href="favicon-76x76.png"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:system-ui,sans-serif}.bar{height:42px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px}.bar strong{font-size:13px}.bar button{border:0;background:#ffffff18;color:#fff;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer}.frame{display:block;width:100%;height:calc(100% - 42px);border:0;background:#fff}body.busy:after{content:'Loading game…';position:fixed;inset:0;display:grid;place-items:center;background:#111827;color:#fff;font-weight:900;z-index:5}</style></head><body class="busy"><div class="bar"><strong id="label">🎮 GIndia Game</strong><div><button onclick="shareGame()">🔗 Share</button><button onclick="location.href='index.html'">⌂ Games</button></div></div><iframe id="gameFrame" class="frame" src="engine.html" title="GIndia Game" allow="fullscreen; autoplay; gamepad; vibrate"></iframe><script>
const gameNames={ladoochor:'🐭 Antigravity Ladoo Chor',cricket:'🏏 Cricket Super Over',highway:'🏎️ Patna Highway Rush',snakesladders:'🐍 Saanp-Seedhi vs AI Bot',wayfinder:'🧭 Way Finder: Maze Adventure',runner:'🚀 Neon Sky Runner',colorcatch:'🎯 Color Catch',math:'🔢 Math Blitz',word:'🔤 Word Builder',memory:'🧩 Memory Match',gk:'🌍 GK Quiz',typing:'⌨️ Typing Challenge',logic:'🧠 Logic Puzzle'};
const params=new URLSearchParams(location.search),game=params.get('game')||'wayfinder';document.title=(gameNames[game]||'GIndia Game')+' | GIndia Game';document.getElementById('label').textContent=gameNames[game]||'🎮 GIndia Game';
const frame=document.getElementById('gameFrame');let tries=0;function launch(){try{const w=frame.contentWindow;if(typeof w.openGame==='function'){w.openGame(game);document.body.classList.remove('busy');return}}catch(e){}if(++tries<40)setTimeout(launch,250);else document.body.classList.remove('busy')}frame.addEventListener('load',()=>setTimeout(launch,150));
async function shareGame(){const url=location.href;try{await navigator.share({title:document.title,text:'Play this GIndia Game',url});}catch(e){try{await navigator.clipboard.writeText(url);alert('Game link copied!');}catch(_){prompt('Copy this game link:',url)}}}
</script></body></html>
