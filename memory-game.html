<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Quest | GIndia Game</title><meta name="description" content="Age-based memory quest for kids with rewards, XP, streaks and celebrations."><link rel="icon" href="favicon-76x76.png"><script src="quest.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Nunito,Arial,sans-serif;background:linear-gradient(135deg,#312e81,#7c3aed,#ec4899);min-height:100vh;color:#fff}.top{height:66px;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;background:#ffffff12;backdrop-filter:blur(12px)}.top img{max-height:50px;width:auto}.nav a{color:#fff;text-decoration:none;font-weight:900;margin-left:8px;padding:8px 12px;border-radius:999px;background:#ffffff18}.wrap{max-width:600px;margin:auto;padding:18px 14px;text-align:center}.ages{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}.age,.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:900;cursor:pointer}.age{background:#ffffff18;color:#fff;border:2px solid #ffffff33}.age.sel{background:#fff;color:#5b21b6}.btn{background:#fff;color:#5b21b6;padding:14px 24px;font-size:17px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}.stat{background:#ffffff18;border-radius:15px;padding:9px}.stat b{display:block;font-size:19px}.stat small{opacity:.65}.grid{display:grid;gap:10px;max-width:500px;margin:auto}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.card{aspect-ratio:1;perspective:700px;cursor:pointer}.inner{height:100%;position:relative;transform-style:preserve-3d;transition:.35s}.card.flip .inner{transform:rotateY(180deg)}.front,.back{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:15px;backface-visibility:hidden}.front{background:#ffffff18;border:2px solid #ffffff35;font-size:28px}.back{background:#fff;color:#172033;transform:rotateY(180deg);font-size:clamp(24px,7vw,40px)}.matched .back{box-shadow:0 0 0 4px #22c55e}.result{display:none}.result.show{display:block}.trophy{font-size:75px}.stars{font-size:38px}.reward{background:#fff;color:#172033;border-radius:22px;padding:18px;margin:18px}.reward b{color:#7c3aed;font-size:24px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.secondary{background:#ffffff18;color:#fff;border:2px solid #ffffff44}.modal{position:fixed;inset:0;background:#111827dd;display:none;align-items:center;justify-content:center;z-index:5}.modal.show{display:flex}.modal-card{background:#fff;color:#172033;border-radius:28px;padding:30px;max-width:380px;text-align:center}.big{font-size:70px}.xp{color:#7c3aed;font-weight:900;font-size:20px}@media(max-width:430px){.hud{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><a href="index.html"><img src="images/logo/logo.png" alt="GIndia Game"></a><nav class="nav"><a href="quest.html">🏆 Quest</a><a href="index.html">🏠</a></nav></header><main class="wrap"><section id="intro"><h1>🃏 Memory Quest</h1><p>Remember the cards, find every pair and earn your trophy!</p><div class="ages"><button class="age" data-age="2-4">🌱 2–4</button><button class="age" data-age="4-6">🌟 4–6</button><button class="age sel" data-age="6-8">🚀 6–8</button><button class="age" data-age="8-10">🏆 8–10</button></div><button class="btn" onclick="start()">▶ Start My Quest</button></section><section id="game" style="display:none"><div class="hud"><div class="stat"><b id="pairs">0</b><small>Pairs</small></div><div class="stat"><b id="moves">0</b><small>Moves</small></div><div class="stat"><b id="time">0:00</b><small>Time</small></div><div class="stat"><b id="ageHud">6–8</b><small>Age</small></div></div><div id="grid" class="grid g4"></div></section><section id="result" class="result"><div class="trophy">🏆</div><h1>Memory Quest Complete!</h1><div id="stars" class="stars"></div><p id="msg"></p><div id="reward" class="reward"></div><div class="actions"><button class="btn" onclick="start()">🔄 Play Again</button><a class="btn secondary" href="quest.html">🏆 Quest Map</a></div></section></main><div id="modal" class="modal"><div class="modal-card"><div class="big">🎉</div><h2>Great Match!</h2><p id="modalText">You found a pair!</p><div class="xp">Keep going! ⭐</div></div></div><script>
let age='6-8',size=4,deck=[],flipped=[],pairs=0,moves=0,secs=0,timer=null,locked=false,totalPairs=8;const ems=['🐱','🐶','🦁','🐘','🐼','🐰','🦄','🦋','🚀','⭐','🍎','🌈','🎈','🎸','🏆','🌟','🍕','🎯'];document.querySelectorAll('.age').forEach(b=>b.onclick=()=>{document.querySelectorAll('.age').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');age=b.dataset.age;GIndiaQuest.setAge(age)});function config(){if(age==='2-4'){size=3;totalPairs=6}else if(age==='4-6'){size=4;totalPairs=8}else if(age==='6-8'){size=4;totalPairs=8}else{size=5;totalPairs=10}}function start(){config();document.getElementById('intro').style.display='none';document.getElementById('result').classList.remove('show');document.getElementById('game').style.display='block';document.getElementById('ageHud').textContent=age;let pick=ems.slice(0,totalPairs),arr=pick.concat(pick);arr.sort(()=>Math.random()-.5);deck=arr;flipped=[];pairs=0;moves=0;secs=0;locked=false;document.getElementById('pairs').textContent=0;document.getElementById('moves').textContent=0;document.getElementById('time').textContent='0:00';let g=document.getElementById('grid');g.className='grid '+(size===3?'g3':size===4?'g4':'g5');g.innerHTML='';arr.forEach((em,i)=>{let c=document.createElement('div');c.className='card';c.dataset.em=em;c.innerHTML='<div class="inner"><div class="front">?</div><div class="back">'+em+'</div></div>';c.onclick=()=>flip(c);g.appendChild(c)});if(timer)clearInterval(timer);timer=setInterval(()=>{secs++;document.getElementById('time').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')},1000)}function flip(c){if(locked||c.classList.contains('flip')||c.classList.contains('matched')||flipped.length===2)return;c.classList.add('flip');flipped.push(c);if(flipped.length===2){moves++;document.getElementById('moves').textContent=moves;check()}}function check(){let[a,b]=flipped;if(a.dataset.em===b.dataset.em){setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');pairs++;document.getElementById('pairs').textContent=pairs;flipped=[];celebrate('🎉 Pair found!');if(pairs===totalPairs)finish()},350)}else{locked=true;setTimeout(()=>{a.classList.remove('flip');b.classList.remove('flip');flipped=[];locked=false},750)}}function celebrate(t){document.getElementById('modalText').textContent=t;let m=document.getElementById('modal');m.classList.add('show');setTimeout(()=>m.classList.remove('show'),450)}function finish(){clearInterval(timer);document.getElementById('game').style.display='none';document.getElementById('result').classList.add('show');let efficiency=totalPairs/moves,pct=Math.min(1,efficiency),stars=pct>=.8?'⭐⭐⭐':pct>=.6?'⭐⭐':'⭐';document.getElementById('stars').textContent=stars;let r=GIndiaQuest.award('memory-quest',pct>=.7?Math.round(pct*10):6,10,{bonus:pct>=.9?50:0});document.getElementById('msg').textContent=`${pairs} pairs • ${moves} moves • ${document.getElementById('time').textContent}`;document.getElementById('reward').innerHTML=r?`🎁 <b>+${r.gained} XP</b><br>Level ${r.level} • ${r.streak}🔥 streak`:'Practice again and aim for a stronger Quest score!';if(r)celebrate('🏆 Quest reward unlocked!')}}
</script></body></html>
