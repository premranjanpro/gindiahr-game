<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Quest | GIndia Game</title><meta name="description" content="Age-based math quest for kids with XP, streaks, stars and celebrations."><link rel="icon" href="favicon-76x76.png"><script src="quest.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Nunito,Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1d4ed8 55%,#38bdf8);min-height:100vh;color:#fff}.top{height:66px;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;background:#ffffff12;backdrop-filter:blur(12px)}.top img{max-height:50px;width:auto}.nav a{color:#fff;text-decoration:none;font-weight:900;margin-left:8px;padding:8px 12px;border-radius:999px;background:#ffffff18}.wrap{max-width:560px;margin:auto;padding:24px 16px}.panel{text-align:center}.intro h1{font-size:clamp(36px,8vw,54px);margin:12px 0 5px}.intro p{opacity:.8}.ages{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0}.age{border:2px solid #ffffff40;background:#ffffff12;color:#fff;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer}.age.sel{background:#fff;color:#1d4ed8}.btn{border:0;border-radius:16px;padding:14px 25px;font-size:17px;font-weight:900;cursor:pointer;background:#fff;color:#1d4ed8;box-shadow:0 10px 30px #0003}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.stat{background:#ffffff16;border:1px solid #ffffff22;border-radius:16px;padding:10px}.stat b{font-size:20px;display:block}.stat small{opacity:.65}.progress{height:9px;background:#ffffff22;border-radius:99px;overflow:hidden;margin:12px 0 20px}.fill{height:100%;background:#fff;width:0;transition:.3s}.question{background:#fff;color:#172033;border-radius:28px;padding:30px 18px;box-shadow:0 18px 50px #0004;margin-bottom:18px}.question .emoji{font-size:34px}.q{font-size:40px;font-weight:900;margin:8px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{padding:18px;border:2px solid #ffffff33;border-radius:18px;background:#ffffff18;color:#fff;font-size:22px;font-weight:900;cursor:pointer}.opt.correct{background:#22c55e}.opt.wrong{background:#ef4444}.result{display:none;text-align:center}.result.show{display:block}.trophy{font-size:80px;animation:bounce 1s infinite alternate}@keyframes bounce{to{transform:translateY(-10px) rotate(5deg)}}.score{font-size:56px;font-weight:900}.stars{font-size:38px;margin:10px}.reward{background:#fff;color:#172033;border-radius:22px;padding:18px;margin:18px 0;box-shadow:0 15px 40px #0003}.reward b{font-size:25px;color:#7c3aed}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.secondary{background:#ffffff20;color:#fff;border:2px solid #ffffff44}.modal{position:fixed;inset:0;background:#0f172acc;display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.modal.show{display:flex}.modal-card{background:#fff;color:#172033;border-radius:30px;padding:34px;max-width:390px;text-align:center;box-shadow:0 30px 100px #0007}.modal-card .big{font-size:72px}.modal-card h2{font-size:30px;margin:5px}.xp{font-size:20px;color:#7c3aed;font-weight:900}@media(max-width:430px){.hud{grid-template-columns:repeat(2,1fr)}.q{font-size:32px}}
</style></head><body><header class="top"><a href="index.html"><img src="images/logo/logo.png" alt="GIndia Game"></a><nav class="nav"><a href="quest.html">🏆 Quest</a><a href="index.html">🏠</a></nav></header><main class="wrap"><section class="panel intro" id="intro"><h1>🧮 Math Quest</h1><p>Choose your age level. Get answers right, build a streak and earn XP!</p><div class="ages"><button class="age" data-age="2-4">🌱 2–4</button><button class="age" data-age="4-6">🌟 4–6</button><button class="age sel" data-age="6-8">🚀 6–8</button><button class="age" data-age="8-10">🏆 8–10</button></div><button class="btn" onclick="start()">▶ Start My Quest</button></section><section id="game" class="panel" style="display:none"><div class="hud"><div class="stat"><b id="score">0</b><small>XP</small></div><div class="stat"><b id="qno">1/10</b><small>Quest</small></div><div class="stat"><b id="streak">0🔥</b><small>Streak</small></div><div class="stat"><b id="ageHud">6–8</b><small>Age</small></div></div><div class="progress"><div id="fill" class="fill"></div></div><div class="question"><div class="emoji">🧠✨</div><div id="q" class="q"></div><small>Pick the correct answer</small></div><div id="options" class="options"></div></section><section id="result" class="result"><div class="trophy">🏆</div><h1>Quest Complete!</h1><div id="final" class="score"></div><div id="stars" class="stars"></div><div id="reward" class="reward"></div><div class="actions"><button class="btn" onclick="start()">🔄 Play Again</button><a class="btn secondary" href="quest.html">🏆 Quest Map</a></div></section></main><div id="celebrate" class="modal"><div class="modal-card"><div class="big" id="celebrateIcon">🎉</div><h2 id="celebrateTitle">Brilliant!</h2><p id="celebrateText">Correct answer!</p><div class="xp" id="celebrateXp"></div></div></div><script>
let age='6-8',idx=0,correct=0,total=10,score=0,locked=false,current=null;const qs=[];const ages=document.querySelectorAll('.age');ages.forEach(b=>b.onclick=()=>{ages.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');age=b.dataset.age;GIndiaQuest.setAge(age)});function range(){return age==='2-4'?5:age==='4-6'?10:age==='6-8'?20:50}function make(){let r=range(),a=Math.floor(Math.random()*r)+1,b=Math.floor(Math.random()*r)+1,op='+';if(age==='6-8'||age==='8-10'){op=['+','-','×'][Math.floor(Math.random()*3)]}if(op==='-'&&b>a)[a,b]=[b,a];let ans=op==='+'?a+b:op==='-'?a-b:a*b;return {text:`${a} ${op} ${b} = ?`,ans}}function opts(ans){let s=new Set([ans]);while(s.size<4){let d=Math.max(0,ans+Math.floor((Math.random()-.5)*range()));s.add(d)}return [...s].sort(()=>Math.random()-.5)}function start(){idx=0;correct=0;score=0;locked=false;document.getElementById('intro').style.display='none';document.getElementById('result').classList.remove('show');document.getElementById('game').style.display='block';document.getElementById('ageHud').textContent=age;load()}function load(){if(idx>=total){finish();return}locked=false;current=make();document.getElementById('q').textContent=current.text;document.getElementById('qno').textContent=`${idx+1}/${total}`;document.getElementById('score').textContent=score;document.getElementById('streak').textContent=GIndiaQuest.get().streak+'🔥';document.getElementById('fill').style.width=(idx/total*100)+'%';let box=document.getElementById('options');box.innerHTML='';opts(current.ans).forEach(v=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>answer(v,b);box.appendChild(b)})}function answer(v,b){if(locked)return;locked=true;let ok=v===current.ans;if(ok){b.classList.add('correct');correct++;score+=100+(GIndiaQuest.get().streak>=2?25:0);const r=GIndiaQuest.award('math',1,1,{bonus:0});celebrate('🌟','Correct!','Amazing answer!','+XP earned');}else{b.classList.add('wrong');GIndiaQuest.miss();document.querySelectorAll('.opt').forEach(x=>{if(+x.textContent===current.ans)x.classList.add('correct')})}setTimeout(()=>{idx++;load()},ok?650:1000)}function celebrate(icon,title,text,xp){let m=document.getElementById('celebrate');document.getElementById('celebrateIcon').textContent=icon;document.getElementById('celebrateTitle').textContent=title;document.getElementById('celebrateText').textContent=text;document.getElementById('celebrateXp').textContent=xp;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),600)}function finish(){document.getElementById('game').style.display='none';document.getElementById('result').classList.add('show');let pct=correct/total;let stars=pct===1?'⭐⭐⭐':pct>=.8?'⭐⭐':pct>=.7?'⭐':'💪';document.getElementById('final').textContent=correct+' / '+total;document.getElementById('stars').textContent=stars;let r=GIndiaQuest.award('math-quest',correct,total,{bonus:pct>=.9?50:0});document.getElementById('reward').innerHTML=pct>=.7?`🎁 <b>+${r?r.gained:0} XP</b><br>Level ${r?r.level:GIndiaQuest.get().level} • ${r?r.streak:GIndiaQuest.get().streak}🔥 streak<br>${pct===1?'🌟 Perfect Quest Badge unlocked!':''}`:'Keep going! Get 7 or more correct to win a Quest reward.';if(pct>=.7){celebrate(pct===1?'🏆':'🎉',pct===1?'PERFECT QUEST!':'QUEST COMPLETE!',`You got ${correct} out of ${total} right!`,`+${r?r.gained:0} XP • Level ${r?r.level:1}`)}}
</script></body></html>
