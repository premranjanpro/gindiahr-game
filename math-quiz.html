<div class="game-wrap">
<!-- INTRO -->
<div class="screen show" id="intro-screen">
<div class="intro-title">🧮 Math Quiz!</div>
<div class="intro-sub">Test your number skills! Answer 10 questions and earn stars!</div>
<div class="level-row">
<button class="lvl-btn sel" id="lvl-easy" onclick="setLevel('easy',this)">😊 Easy (1-10)</button>
<button class="lvl-btn" id="lvl-mid" onclick="setLevel('medium',this)">🤔 Medium (1-20)</button>
<button class="lvl-btn" id="lvl-hard" onclick="setLevel('hard',this)">🔥 Hard (1-50)</button>
</div>
<button class="start-btn" onclick="startGame()">▶ Start Quiz!</button>
</div>

<!-- GAME -->
<div class="screen" id="game-screen" style="width:100%;max-width:440px;">
<div class="hud">
<div class="hud-item"><div class="hud-val" id="score-hud">0</div><div class="hud-lbl">Score</div></div>
<div class="hud-item"><div class="hud-val" id="q-hud">1/10</div><div class="hud-lbl">Question</div></div>
<div class="hud-item"><div class="hud-val" id="streak-hud">0🔥</div><div class="hud-lbl">Streak</div></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
<div class="progress-txt" id="prog-txt">Question 1 of 10</div>
<div class="qbox" style="margin-top:14px;">
<div class="qtxt" id="qtxt"></div>
<div class="qsub">What is the answer?</div>
</div>
<div class="opts" id="opts"></div>
</div>

<!-- RESULT -->
<div class="screen" id="result-screen">
<div class="score-circle"><div class="score-num" id="final-score">0</div><div class="score-lbl">Points</div></div>
<div class="stars-row" id="stars"></div>
<div class="result-msg" id="result-msg"></div>
<div class="result-btns">
<button class="rbtn" onclick="startGame()">🔄 Play Again</button>
<button class="rbtn outline" onclick="showIntro()">🏠 Menu</button>
</div>
</div>
</div>

<footer>© 2025 GIndia Game — Free Kids Games | <a href="https://gindiahr.com">gindiahr.com</a></footer>

<script>
var level="easy",score=0,qIdx=0,streak=0,total=10,answered=false;
var ops=["+","-","x"];

function setLevel(l,btn){
  level=l;
  document.querySelectorAll(".lvl-btn").forEach(function(b){b.classList.remove("sel");});
  btn.classList.add("sel");
}

function getRange(){return level==="easy"?10:level==="medium"?20:50;}

function genQ(){
  var r=getRange();
  var a=Math.floor(Math.random()*r)+1;
  var b=Math.floor(Math.random()*r)+1;
  var op=ops[Math.floor(Math.random()*ops.length)];
  var ans;
  if(op==="+"){ans=a+b;}
  else if(op==="-"){if(a<b){var t=a;a=b;b=t;}ans=a-b;}
  else{ans=a*b;}
  var opSym=op==="x"?"×":op;
  return{text:a+" "+opSym+" "+b+" = ?",ans:ans};
}

function genOpts(correct){
  var opts=new Set([correct]);
  while(opts.size<4){
    var r=getRange();
    var fake=Math.max(0,correct+Math.floor((Math.random()-.5)*r));
    opts.add(fake);
  }
  return Array.from(opts).sort(function(){return Math.random()-.5;});
}

var curQ=null;

function showScreen(id){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("show");});
  document.getElementById(id).classList.add("show");
}
function showIntro(){showScreen("intro-screen");}

function startGame(){
  score=0;qIdx=0;streak=0;answered=false;
  showScreen("game-screen");
  loadQ();
}

function loadQ(){
  if(qIdx>=total){showResult();return;}
  answered=false;
  curQ=genQ();
  document.getElementById("qtxt").textContent=curQ.text;
  document.getElementById("q-hud").textContent=(qIdx+1)+"/"+total;
  document.getElementById("score-hud").textContent=score;
  document.getElementById("streak-hud").textContent=streak+"🔥";
  var pct=((qIdx)/total)*100;
  document.getElementById("prog").style.width=pct+"%";
  document.getElementById("prog-txt").textContent="Question "+(qIdx+1)+" of "+total;
  var optArr=genOpts(curQ.ans);
  var oc=document.getElementById("opts");oc.innerHTML="";
  optArr.forEach(function(o){
    var btn=document.createElement("button");
    btn.className="opt";btn.textContent=o;
    btn.onclick=function(){if(!answered)checkAns(o,btn);};
    oc.appendChild(btn);
  });
}

function checkAns(val,btn){
  answered=true;
  if(val===curQ.ans){
    btn.classList.add("correct");
    score+=streak>=3?150:100;
    streak++;
  }else{
    btn.classList.add("wrong");
    streak=0;
    document.querySelectorAll(".opt").forEach(function(b){
      if(parseInt(b.textContent)===curQ.ans)b.classList.add("correct");
    });
  }
  document.querySelectorAll(".opt").forEach(function(b){b.disabled=true;});
  setTimeout(function(){qIdx++;loadQ();},1200);
}

function showResult(){
  showScreen("result-screen");
  document.getElementById("final-score").textContent=score;
  var pct=score/(total*150);
  var stars=pct>=.9?"⭐⭐⭐":pct>=.7?"⭐⭐":pct>=.5?"⭐":"";
  document.getElementById("stars").textContent=stars;
  var msg=pct>=.9?"🎉 Outstanding! Math Champion!":pct>=.7?"😊 Great job! Well done!":pct>=.5?"👍 Good effort! Keep practising!":"💪 Try again — you can do better!";
  document.getElementById("result-msg").textContent=msg;
}
</script>
