<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Quest | GIndia Game</title><meta name="description" content="Age-based spelling and word quest for kids with XP, stars, streaks and rewards."><link rel="icon" href="favicon-76x76.png"><script src="quest.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Nunito,Arial,sans-serif;background:linear-gradient(135deg,#064e3b,#059669,#14b8a6);min-height:100vh;color:#fff}.top{height:66px;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;background:#ffffff12;backdrop-filter:blur(12px)}.top img{max-height:50px;width:auto}.nav a{color:#fff;text-decoration:none;font-weight:900;margin-left:8px;padding:8px 12px;border-radius:999px;background:#ffffff18}.wrap{max-width:600px;margin:auto;padding:20px 15px;text-align:center}.ages,.cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.pill{border:2px solid #ffffff35;background:#ffffff15;color:#fff;border-radius:999px;padding:9px 14px;font-weight:900;cursor:pointer}.pill.sel{background:#fff;color:#047857}.btn{border:0;border-radius:15px;padding:13px 22px;font-size:17px;font-weight:900;background:#fff;color:#047857;cursor:pointer}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:#ffffff18;border-radius:14px;padding:9px}.stat b{display:block;font-size:19px}.stat small{opacity:.65}.clue{background:#fff;color:#172033;border-radius:26px;padding:24px;margin:15px 0;box-shadow:0 20px 50px #0003}.emoji{font-size:62px}.hint{color:#64748b;font-size:13px}.blanks{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:18px 0}.blank{width:42px;height:48px;border-bottom:3px solid #fff;background:#ffffff18;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}.keyboard{display:flex;flex-direction:column;gap:6px}.row{display:flex;justify-content:center;gap:5px}.key{width:31px;height:40px;border:0;border-radius:8px;background:#fff;color:#047857;font-weight:900;cursor:pointer}.key.correct{background:#22c55e;color:#fff}.key.wrong{background:#ef4444;color:#fff}.life{font-size:20px}.result{display:none}.result.show{display:block}.trophy{font-size:76px}.stars{font-size:38px}.reward{background:#fff;color:#172033;border-radius:22px;padding:18px;margin:18px}.reward b{color:#7c3aed;font-size:24px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.secondary{background:#ffffff18;color:#fff;border:2px solid #ffffff44}.modal{position:fixed;inset:0;background:#052e2acc;display:none;align-items:center;justify-content:center;z-index:10}.modal.show{display:flex}.modal-card{background:#fff;color:#172033;border-radius:28px;padding:30px;max-width:380px;text-align:center}.big{font-size:68px}.xp{color:#7c3aed;font-weight:900;font-size:20px}@media(max-width:430px){.hud{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><a href="index.html"><img src="images/logo/logo.png" alt="GIndia Game"></a><nav class="nav"><a href="quest.html">🏆 Quest</a><a href="index.html">🏠</a></nav></header><main class="wrap"><section id="intro"><h1>🔤 Word Quest</h1><p>Build words, keep your hearts and earn your next badge!</p><div class="ages"><button class="pill" data-age="2-4">🌱 2–4</button><button class="pill" data-age="4-6">🌟 4–6</button><button class="pill sel" data-age="6-8">🚀 6–8</button><button class="pill" data-age="8-10">🏆 8–10</button></div><div class="cats"><button class="pill sel" data-cat="all">All 🌟</button><button class="pill" data-cat="animals">Animals 🐾</button><button class="pill" data-cat="fruits">Fruits 🍎</button><button class="pill" data-cat="things">Things 🎒</button></div><button class="btn" onclick="start()">▶ Start My Quest</button></section><section id="game" style="display:none"><div class="hud"><div class="stat"><b id="score">0</b><small>Score</small></div><div class="stat"><b id="qno">1/10</b><small>Quest</small></div><div class="stat"><b id="streak">0🔥</b><small>Streak</small></div><div class="stat"><b id="ageHud">6–8</b><small>Age</small></div></div><div class="clue"><div id="emoji" class="emoji"></div><b id="hint" class="hint"></b></div><div id="lives"></div><div id="blanks" class="blanks"></div><div id="keyboard" class="keyboard"></div></section><section id="result" class="result"><div class="trophy">🏆</div><h1>Word Quest Complete!</h1><div id="stars" class="stars"></div><p id="summary"></p><div id="reward" class="reward"></div><div class="actions"><button class="btn" onclick="start()">🔄 Play Again</button><a class="btn secondary" href="quest.html">🏆 Quest Map</a></div></section></main><div id="modal" class="modal"><div class="modal-card"><div class="big">🎉</div><h2 id="modalTitle">Correct Letter!</h2><p id="modalText">Great thinking!</p><div class="xp">Keep your streak alive 🔥</div></div></div><script>
const bank=[['CAT','🐱','animals','A furry pet that says meow!'],['DOG','🐶','animals','A loyal pet that says woof!'],['LION','🦁','animals','King of the jungle!'],['FISH','🐟','animals','Lives in water!'],['FROG','🐸','animals','Jumps and says ribbit!'],['APPLE','🍎','fruits','A red fruit!'],['MANGO','🥭','fruits','King of fruits!'],['LEMON','🍋','fruits','Yellow and sour!'],['BANANA','🍌','fruits','Yellow curved fruit!'],['GRAPE','🍇','fruits','Grows in bunches!'],['BOOK','📚','things','You read it to learn!'],['BALL','⚽','things','Round and fun to play with!'],['CHAIR','🪑','things','You sit on it!'],['CLOCK','🕐','things','Tells the time!'],['PLANE','✈️','things','Flies in the sky!'],['TRAIN','🚂','things','Runs on tracks!'],['CLOUD','☁️','things','Floats in the sky!'],['EARTH','🌍','things','Our home planet!']];let age='6-8',cat='all',words=[],idx=0,score=0,correct=0,lives=6,guessed=[],cur=null;document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-age]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');age=b.dataset.age;GIndiaQuest.setAge(age)});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');cat=b.dataset.cat});function start(){let pool=cat==='all'?bank:bank.filter(x=>x[2]===cat);let max=age==='2-4'?3:age==='4-6'?4:age==='6-8'?5:6;words=pool.filter(x=>x[0].length<=max).sort(()=>Math.random()-.5).slice(0,10);idx=0;score=0;correct=0;document.getElementById('intro').style.display='none';document.getElementById('result').classList.remove('show');document.getElementById('game').style.display='block';document.getElementById('ageHud').textContent=age;load()}function load(){if(idx>=words.length){finish();return}cur=words[idx];guessed=[];lives=6;render();document.getElementById('qno').textContent=(idx+1)+'/'+words.length;document.getElementById('score').textContent=score;document.getElementById('streak').textContent=GIndiaQuest.get().streak+'🔥'}function render(){document.getElementById('emoji').textContent=cur[1];document.getElementById('hint').textContent=cur[3];document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(6-lives);document.getElementById('blanks').innerHTML=[...cur[0]].map(ch=>`<div class="blank">${guessed.includes(ch)?ch:''}</div>`).join('');let rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];document.getElementById('keyboard').innerHTML=rows.map(row=>'<div class="row">'+[...row].map(ch=>`<button class="key ${guessed.includes(ch)?(cur[0].includes(ch)?'correct':'wrong'):''}" ${guessed.includes(ch)?'disabled':''} onclick="guess('${ch}')">${ch}</button>`).join('')+'</div>').join('')}function guess(ch){if(guessed.includes(ch))return;guessed.push(ch);if(cur[0].includes(ch)){score+=20;correct++;showModal('🌟','Correct letter!','Nice work!')}else{lives--;GIndiaQuest.miss();showModal('💪','Keep trying!','You have '+lives+' hearts left.')}render();if([...cur[0]].every(c=>guessed.includes(c))||lives<=0)setTimeout(()=>{idx++;load()},700)}function showModal(i,t,txt){document.getElementById('modal').classList.add('show');document.getElementById('modal').querySelector('.big').textContent=i;document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').textContent=txt;setTimeout(()=>document.getElementById('modal').classList.remove('show'),450)}function finish(){document.getElementById('game').style.display='none';document.getElementById('result').classList.add('show');let pct=correct/(words.length||1);document.getElementById('stars').textContent=pct>=.9?'⭐⭐⭐':pct>=.7?'⭐⭐':pct>=.5?'⭐':'💪';let r=GIndiaQuest.award('word-quest',Math.round(pct*10),10,{bonus:pct===1?50:0});document.getElementById('summary').textContent=`${correct} strong word rounds completed • ${score} points`;document.getElementById('reward').innerHTML=r?`🎁 <b>+${r.gained} XP</b><br>Level ${r.level} • ${r.streak}🔥 streak`:'Reach 70% to unlock a Quest reward.';if(r)showModal('🏆','Quest Reward!','You unlocked XP and moved forward!')}
</script></body></html>
