*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#065f46,#10b981);min-height:100vh;display:flex;flex-direction:column;}
nav{background:rgba(255,255,255,.12);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15);}
.nl{font-size:18px;font-weight:900;color:#fff;}
.nb{display:flex;gap:8px;}.nb a{font-size:13px;font-weight:700;color:rgba(255,255,255,.8);padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.12);text-decoration:none;}
.game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.screen{display:none;width:100%;max-width:440px;text-align:center;}
.screen.show{display:block;}
/* INTRO */
.intro-title{font-size:36px;font-weight:900;color:#fff;margin-bottom:8px;}
.intro-sub{font-size:15px;color:rgba(255,255,255,.75);margin-bottom:28px;}
.cat-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
.cbtn{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.3);color:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;padding:8px 18px;border-radius:24px;cursor:pointer;transition:all .2s;}
.cbtn.sel{background:#fff;color:#065f46;}
.start-btn{background:#fff;color:#065f46;border:none;padding:14px 36px;border-radius:24px;font-family:'Nunito',sans-serif;font-size:18px;font-weight:900;cursor:pointer;}
/* GAME */
.hud{background:rgba(255,255,255,.15);border-radius:16px;padding:12px 20px;display:flex;justify-content:space-between;margin-bottom:16px;}
.hud-item{text-align:center;}.hud-val{font-size:20px;font-weight:900;color:#fff;}.hud-lbl{font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;}
.clue-box{background:#fff;border-radius:22px;padding:28px 20px;margin-bottom:16px;}
.clue-em{font-size:56px;margin-bottom:8px;}
.clue-hint{font-size:13px;color:#888;margin-top:4px;}
.blanks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
.blank{width:40px;height:48px;background:rgba(255,255,255,.2);border-bottom:3px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;border-radius:4px;}
.blank.filled{background:rgba(255,255,255,.35);}
.keyboard{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.kbd-row{display:flex;gap:5px;justify-content:center;}
.key{background:rgba(255,255,255,.85);color:#065f46;border:none;width:32px;height:40px;border-radius:8px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;cursor:pointer;transition:all .15s;}
.key:hover:not([disabled]){background:#fff;transform:scale(1.08);}
.key.used{background:rgba(255,255,255,.25);color:rgba(255,255,255,.5);}
.key.correct{background:#22c55e;color:#fff;}
.key.wrong{background:rgba(239,68,68,.6);color:#fff;}
.del-btn{width:52px;font-size:12px;}
.life-row{display:flex;gap:6px;justify-content:center;margin-bottom:8px;}
.life{font-size:22px;}
/* RESULT */
.result{text-align:center;max-width:380px;margin:auto;}
.result h2{font-size:30px;font-weight:900;color:#fff;margin-bottom:8px;}
.rword{font-size:20px;font-weight:900;color:#fff;margin-bottom:6px;}
.rctg{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:14px;}
.rscore{font-size:16px;color:rgba(255,255,255,.9);margin-bottom:20px;}
.rbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.rbtn{background:#fff;color:#065f46;border:none;padding:12px 24px;border-radius:20px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;cursor:pointer;}
.rbtn.out{background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.4);}
footer{text-align:center;padding:14px;font-size:12px;color:rgba(255,255,255,.4);}footer a{color:rgba(255,255,255,.6);}
</style>

<div class="game-wrap">
<div class="screen show" id="intro-screen">
<div class="intro-title">🔤 Word Guess!</div>
<div class="intro-sub">Look at the emoji clue and guess the word!</div>
<div class="cat-row">
<button class="cbtn sel" id="cat-all" onclick="setCat('all',this)">All 🌟</button>
<button class="cbtn" onclick="setCat('animals',this)">Animals 🐾</button>
<button class="cbtn" onclick="setCat('fruits',this)">Fruits 🍎</button>
<button class="cbtn" onclick="setCat('things',this)">Things 🎒</button>
</div>
<button class="start-btn" onclick="startGame()">▶ Start Game!</button>
</div>

<div class="screen" id="game-screen" style="max-width:440px;width:100%;">
<div class="hud">
<div class="hud-item"><div class="hud-val" id="h-score">0</div><div class="hud-lbl">Score</div></div>
<div class="hud-item"><div class="hud-val" id="h-q">1/10</div><div class="hud-lbl">Word</div></div>
<div class="hud-item"><div class="hud-val" id="h-streak">0🔥</div><div class="hud-lbl">Streak</div></div>
</div>
<div class="clue-box">
<div class="clue-em" id="clue-em"></div>
<div class="clue-hint" id="clue-hint"></div>
</div>
<div class="life-row" id="life-row"></div>
<div class="blanks" id="blanks"></div>
<div class="keyboard" id="keyboard"></div>
</div>

<div class="screen" id="result-screen">
<div class="result">
<h2 id="r-title">🎉 Correct!</h2>
<div class="rword" id="r-word"></div>
<div class="rctg" id="r-cat"></div>
<div class="rscore" id="r-score"></div>
<div class="rbtns">
<button class="rbtn" onclick="nextWord()">▶ Next Word</button>
<button class="rbtn out" onclick="showIntro()">🏠 Menu</button>
</div>
</div>
</div>
</div>

<footer>© 2025 GIndia Game | <a href="https://gindiahr.com">gindiahr.com</a></footer>

<script>
var wordBank=[
{w:"CAT",em:"🐱",cat:"animals",hint:"A furry pet that says meow!"},
{w:"DOG",em:"🐶",cat:"animals",hint:"A loyal pet that says woof!"},
{w:"COW",em:"🐄",cat:"animals",hint:"Gives us milk!"},
{w:"LION",em:"🦁",cat:"animals",hint:"King of the jungle!"},
{w:"FROG",em:"🐸",cat:"animals",hint:"Jumps and says ribbit!"},
{w:"BEAR",em:"🐻",cat:"animals",hint:"Big furry animal that loves honey!"},
{w:"FISH",em:"🐟",cat:"animals",hint:"Lives in water and has fins!"},
{w:"DUCK",em:"🦆",cat:"animals",hint:"Says quack quack!"},
{w:"APPLE",em:"🍎",cat:"fruits",hint:"Red fruit that keeps doctors away!"},
{w:"MANGO",em:"🥭",cat:"fruits",hint:"King of fruits — very sweet!"},
{w:"GRAPE",em:"🍇",cat:"fruits",hint:"Small purple or green fruits in a bunch!"},
{w:"LEMON",em:"🍋",cat:"fruits",hint:"Yellow and very sour!"},
{w:"BANANA",em:"🍌",cat:"fruits",hint:"Yellow curved fruit monkeys love!"},
{w:"ORANGE",em:"🍊",cat:"fruits",hint:"Round fruit — also a colour!"},
{w:"BOOK",em:"📚",cat:"things",hint:"You read it to learn!"},
{w:"BALL",em:"⚽",cat:"things",hint:"Round and used to play sports!"},
{w:"CHAIR",em:"🪑",cat:"things",hint:"You sit on this!"},
{w:"CLOCK",em:"🕐",cat:"things",hint:"Tells you the time!"},
{w:"PLANE",em:"✈️",cat:"things",hint:"Flies in the sky!"},
{w:"TRAIN",em:"🚂",cat:"things",hint:"Runs on tracks!"},
{w:"CLOUD",em:"☁️",cat:"things",hint:"White fluffy thing in the sky!"},
{w:"EARTH",em:"🌍",cat:"things",hint:"Our home planet!"}
];

var curCat="all",score=0,streak=0,qIdx=0,total=10,lives=6,guessed=[],curWord=null,finished=false,words=[];

var ROWS=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];

function setCat(c,btn){curCat=c;document.querySelectorAll(".cbtn").forEach(function(b){b.classList.remove("sel");});btn.classList.add("sel");}

function showScreen(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("show");});document.getElementById(id).classList.add("show");}
function showIntro(){showScreen("intro-screen");score=0;streak=0;qIdx=0;}

function startGame(){
  score=0;streak=0;qIdx=0;
  var pool=curCat==="all"?wordBank:wordBank.filter(function(w){return w.cat===curCat;});
  words=pool.sort(function(){return Math.random()-.5;}).slice(0,Math.min(total,pool.length));
  total=words.length;
  showScreen("game-screen");
  loadWord();
}

function loadWord(){
  if(qIdx>=total){showFinal();return;}
  curWord=words[qIdx];guessed=[];lives=6;finished=false;
  renderWord();renderLifes();renderKeyboard();
  document.getElementById("clue-em").textContent=curWord.em;
  document.getElementById("clue-hint").textContent=curWord.hint;
  document.getElementById("h-q").textContent=(qIdx+1)+"/"+total;
  document.getElementById("h-score").textContent=score;
  document.getElementById("h-streak").textContent=streak+"🔥";
}

function renderWord(){
  var b=document.getElementById("blanks");b.innerHTML="";
  curWord.w.split("").forEach(function(ch){
    var d=document.createElement("div");
    d.className="blank"+(guessed.indexOf(ch)>=0?" filled":"");
    d.textContent=guessed.indexOf(ch)>=0?ch:"";
    b.appendChild(d);
  });
}

function renderLifes(){
  var lr=document.getElementById("life-row");lr.innerHTML="";
  for(var i=0;i<6;i++){var s=document.createElement("span");s.className="life";s.textContent=i<lives?"❤️":"🖤";lr.appendChild(s);}
}

function renderKeyboard(){
  var kb=document.getElementById("keyboard");kb.innerHTML="";
  ROWS.forEach(function(row){
    var r=document.createElement("div");r.className="kbd-row";
    row.split("").forEach(function(ch){
      var btn=document.createElement("button");
      btn.className="key";btn.textContent=ch;btn.id="key-"+ch;
      btn.onclick=function(){guess(ch,btn);};
      if(guessed.indexOf(ch)>=0){
        btn.classList.add(curWord.w.indexOf(ch)>=0?"correct":"wrong");
        btn.disabled=true;
      }
      r.appendChild(btn);
    });
    kb.appendChild(r);
  });
}

function guess(ch,btn){
  if(finished||guessed.indexOf(ch)>=0)return;
  guessed.push(ch);
  var inWord=curWord.w.indexOf(ch)>=0;
  btn.classList.add(inWord?"correct":"wrong");btn.disabled=true;
  if(!inWord){lives--;}
  renderWord();renderLifes();
  var won=curWord.w.split("").every(function(c){return guessed.indexOf(c)>=0;});
  if(won){streak++;score+=streak>2?150:100;showResult(true);}
  else if(lives<=0){streak=0;showResult(false);}
}

function showResult(win){
  finished=true;
  showScreen("result-screen");
  document.getElementById("r-title").textContent=win?"🎉 Correct!":"😢 Try Next!";
  document.getElementById("r-word").textContent="Word: "+curWord.w;
  document.getElementById("r-cat").textContent=curWord.em+" — "+curWord.hint;
  document.getElementById("r-score").textContent="Score: "+score+" | Streak: "+streak;
}

function nextWord(){qIdx++;loadWord();showScreen("game-screen");}

function showFinal(){
  showScreen("result-screen");
  document.getElementById("r-title").textContent="🏆 Game Over!";
  document.getElementById("r-word").textContent="Final Score: "+score;
  document.getElementById("r-cat").textContent="";
  document.getElementById("r-score").textContent=score>=800?"⭐⭐⭐ Word Master!":score>=500?"⭐⭐ Great job!":"⭐ Good try! Play again!";
}
</script>
</body>
